<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>opengrok — run any model in Grok Bot — one-command setup</title>
  <desc>A dark GitHub-style social card with a terminal prompt and model picker list.</desc>
  <rect width="1600" height="900" fill="#0d1117"/>
  <rect x="56" y="56" width="1488" height="788" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M56 156H1544" stroke="#30363d" stroke-width="2"/>
  <circle cx="102" cy="106" r="8" fill="#ff7b72"/><circle cx="130" cy="106" r="8" fill="#d29922"/><circle cx="158" cy="106" r="8" fill="#3fb950"/>
  <text x="205" y="115" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" letter-spacing="2">CHRIS COVERIES / DEVELOPER TOOL</text>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="126" y="310" fill="#8b949e" font-size="22" letter-spacing="4">FROM ZERO TO GROK</text>
    <text x="120" y="416" fill="#f0f6fc" font-size="88" font-weight="700" letter-spacing="-3">opengrok</text>
    <text x="124" y="482" fill="#8b949e" font-size="31">run any model in Grok Bot — one-command setup</text>
    <rect x="124" y="554" width="214" height="5" rx="3" fill="#d29922"/>
    <text x="124" y="620" fill="#8b949e" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">install · pick · chat</text>
  </g>

  <g transform="translate(855 188)">
    <rect x="0" y="0" width="584" height="542" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <path d="M0 62H584" stroke="#30363d" stroke-width="2"/>
    <circle cx="30" cy="31" r="7" fill="#ff7b72"/><circle cx="56" cy="31" r="7" fill="#d29922"/><circle cx="82" cy="31" r="7" fill="#3fb950"/>
    <text x="118" y="38" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">opengrok — terminal</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="36" y="111" fill="#d29922" font-size="22">$</text><text x="65" y="111" fill="#f0f6fc" font-size="22">opengrok init</text>
      <text x="36" y="148" fill="#8b949e" font-size="17">one command. every model.</text>
      <text x="36" y="204" fill="#d29922" font-size="20">›</text><text x="65" y="204" fill="#f0f6fc" font-size="20">select a model</text>
    </g>
    <g transform="translate(36 232)">
      <rect x="0" y="0" width="512" height="190" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">
        <rect x="16" y="16" width="480" height="44" rx="9" fill="#2d2111" stroke="#d29922" stroke-width="2"/>
        <text x="34" y="44" fill="#d29922">●</text><text x="58" y="44" fill="#f0f6fc">grok-3</text><text x="422" y="44" fill="#8b949e">ready</text>
        <text x="34" y="92" fill="#8b949e">○</text><text x="58" y="92" fill="#f0f6fc">grok-2</text><text x="422" y="92" fill="#8b949e">ready</text>
        <text x="34" y="140" fill="#8b949e">○</text><text x="58" y="140" fill="#f0f6fc">custom-model</text><text x="382" y="140" fill="#8b949e">BYOK</text>
      </g>
    </g>
    <text x="36" y="474" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">grok &gt; ready_</text>
    <path d="M36 494H548" stroke="#30363d" stroke-width="2"/>
    <text x="36" y="522" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">model picker / interactive setup</text>
  </g>
  <text x="120" y="790" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" letter-spacing="1">OPENGROK / THE FAST PATH TO A MODEL</text>
